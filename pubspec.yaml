name: dindin
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# Version scheme — read this before bumping. Full rationale in docs/DEPLOY.md
# ("Versioning"). Format is `<versionName>+<versionCode>`:
#
#   versionName (1.0.0)  Semantic version of the PRODUCT, shared by every
#                        distribution channel (Web, Android, Windows). This is
#                        the number a human sees. Bump MAJOR/MINOR/PATCH by the
#                        usual semver judgement.
#
#   versionCode (+1)     ANDROID ONLY. A monotonic counter of artifacts uploaded
#                        to the Play Console. Google Play refuses any upload
#                        whose versionCode is not strictly greater than every
#                        code previously uploaded to the app — including builds
#                        that were only sent to internal testing, or that were
#                        rejected. It can never be reused or lowered, for the
#                        lifetime of the listing.
#
# Practical rules:
#   - Web deploys (`flutter build web`) ignore versionCode entirely. Bumping it
#     without a web release, or releasing web without bumping it, are both
#     normal. It counts Play uploads, not product releases.
#   - +1 the versionCode for EVERY AAB you upload, even a re-upload of an
#     otherwise-identical build. Never edit it downwards.
#   - Do not switch to a date-based code (e.g. 20260827): it caps you at one
#     upload per day and burns the integer space irreversibly.
#   - scripts/release_android.sh bumps and verifies this for you.
#
# First Play release: 1.0.0+1 (nothing has ever been uploaded, so code 1 is
# still free).
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  flutter_localizations:
    sdk: flutter
  go_router: ^17.3.0
  fl_chart: ^1.2.0
  intl: any
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_sign_in: ^7.2.0
  file_selector: ^1.1.0
  file_saver: ^0.4.0
  collection: ^1.19.1
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.1.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/logo.svg

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "assets/icon/logo_1024.png"
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#FCFCFB"
  adaptive_icon_foreground: "assets/icon/logo_1024.png"
  windows:
    generate: true
    image_path: "assets/icon/logo_1024.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/logo_1024.png"
    background_color: "#FCFCFB"
    theme_color: "#1BAF7A"
