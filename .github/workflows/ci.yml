name: CI

# MVP-scale CI: analyze + test + an Android release-build check on every push
# to main. No deploy step here, for web or for Android — shipping to production
# stays a deliberate manual action via `scripts/deploy.sh` (web) or
# `scripts/release_android.sh` + a Play Console upload (Android). See
# docs/DEPLOY.md, including "Why the Play upload is manual".
#
# Cost: this repository is PUBLIC (github.com/CafeLabsCorp/dindin), so GitHub
# Actions minutes are unmetered — there is no free-tier cap to blow through and
# no billing surface here at all. (For reference, if it were ever made private,
# the cap is 2,000 min/month and the android job below is the expensive one at
# roughly 10 minutes a run.)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  rules:
    name: firestore rules + backfill tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The Firestore emulator runs on the JVM. firebase-tools requires JDK 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install rules test harness deps
        working-directory: test/rules
        run: npm ci

      # backfill.test.mjs spawns scripts/backfill_balances.mjs as a real
      # subprocess, which needs its own firebase-admin install.
      - name: Install backfill script deps
        working-directory: scripts
        run: npm ci

      # `emulators:exec` starts the Firestore emulator, runs the given
      # command, then tears the emulator down — no manual start/stop needed
      # and no project credentials required (emulator-only, never touches
      # production). Mirrors the local repro steps documented in
      # test/rules/rules.test.mjs's header. `npm test` (see test/rules/
      # package.json) runs BOTH rules.test.mjs (Security Rules) AND
      # backfill.test.mjs (scripts/backfill_balances.mjs's debt/corruption
      # classification, run as a real subprocess against this same emulator)
      # in one pass — a new test file here is picked up automatically only if
      # it's added to that script's file list, not by directory convention.
      - name: Run rules + backfill tests against the Firestore emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project dindin-rules-test "npm test --prefix test/rules"

  # Builds the Android App Bundle the way a real release does, minus the
  # signing key. `flutter analyze`/`flutter test` do NOT compile the Android
  # target, so without this job a broken Gradle/manifest/plugin change is only
  # discovered on release day, by hand, under time pressure.
  #
  # NOT a deploy job: it uploads nothing to Google Play, and it holds no
  # secrets. android/key.properties is absent here (it is gitignored and lives
  # only on the maintainer's machine), so android/app/build.gradle.kts falls
  # back to the debug key and prints a loud warning. That is intentional — it
  # also proves the fallback path keeps working for fresh clones. The resulting
  # .aab is deliberately NOT published as a workflow artifact: a debug-signed
  # bundle is not installable-from-Play and not something anyone should be
  # tempted to upload.
  android:
    name: android release build (unsigned check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # AGP 9 / Gradle 9.1 require JDK 17+; 17 matches the source/target
      # compatibility in android/app/build.gradle.kts.
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: "stable"
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: flutter pub get

      - name: Build release AAB (debug-signed — verifies the build, not the release)
        run: flutter build appbundle --release

      # Cheap guard against the version scheme silently regressing: Play
      # rejects any upload whose versionCode is not a positive integer greater
      # than every previous one, and the most common way that breaks is a bad
      # edit to pubspec.yaml's `version:` line.
      - name: Check pubspec version parses as <name>+<code>
        run: |
          line="$(grep -m1 '^version: ' pubspec.yaml)"
          echo "$line"
          echo "$line" | grep -qE '^version: [0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$' \
            || { echo "::error::pubspec.yaml version must be <major>.<minor>.<patch>+<versionCode>, see docs/DEPLOY.md"; exit 1; }
